name: Run script and commit output

on:
  schedule:
    # Runs every 12 hours (at minute 0 of every 12th hour UTC)
    - cron: "0 */12 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push changes back to the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit properly (optional but recommended)
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.12
          pip-install: bs4 requests

      - name: Run script
        run: python3 script.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Upload database"
          # Adjust the file pattern if your script generates more than one file
          file_pattern: "output.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
