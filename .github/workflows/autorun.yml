name: Run script and commit output

on:
  schedule:
    # Runs every 12 hours (at minute 0 of every 12th hour UTC)
    - cron: "0 */12 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push changes back to the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit properly (optional but recommended)
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.12
          pip-install: bs4 requests

      - name: Run script
        run: python3 script.py

      - name: Extract number of songs from output.json
        id: get_total
        run: |
          total=$(jq '.total' output.json)
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "Number of songs: $total"

      - name: Get current UTC date and time
        id: get_date
        run: |
          datetime=$(date -u +"%d-%m-%Y %H:%M:%S UTC")
          echo "datetime=$datetime" >> $GITHUB_OUTPUT
          echo "Last updated: $datetime"

      - name: Update README.md with songs count and timestamp
        run: |
          total=${{ steps.get_total.outputs.total }}
          datetime="${{ steps.get_date.outputs.datetime }}"

          # Update or add the "Number of songs:" line
          if grep -q "^Number of songs:" README.md; then
            sed -i "s/^Number of songs: [0-9]*/Number of songs: $total/" README.md
          else
            echo "Number of songs: $total" >> README.md
          fi

          # Update or add the "Last updated:" line
          if grep -q "^Last updated:" README.md; then
            sed -i "s/^Last updated: .*/Last updated: $datetime/" README.md
          else
            echo "Last updated: $datetime" >> README.md
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update everything"
          # Adjust the file pattern if your script generates more than one file
          file_pattern: "output.json README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
